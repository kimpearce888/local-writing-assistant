<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>E2E textarea test page</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 24px; }
    h1 { font-size: 18px; margin: 0 0 16px 0; }
    textarea { width: 600px; height: 200px; font: inherit; padding: 8px; }
    .status { margin-top: 16px; padding: 8px; background: #f0f3f6; border-radius: 6px; min-height: 24px; }
  </style>
</head>
<body>
  <h1>Local Writing Assistant — E2E textarea page</h1>
  <textarea id="editor" data-lwa-test="editor">She don't like it.</textarea>
  <div class="status" id="status">idle</div>

  <!-- Sensitive field: must NOT be analyzed -->
  <input type="password" id="pw" placeholder="password" />

  <!-- Regular input: should be analyzed -->
  <input type="text" id="plain-input" value="He go to school." />

  <!-- Sensitive-looking input: must NOT be analyzed -->
  <input type="text" id="api-key" name="api_key" value="sk-abcdef" />

  <script>
    // Helper for tests to read the current editor value.
    window.__getEditorValue = function () {
      return document.getElementById('editor').value;
    };
    window.__getPlainInputValue = function () {
      return document.getElementById('plain-input').value;
    };
  </script>
</body>
</html>
