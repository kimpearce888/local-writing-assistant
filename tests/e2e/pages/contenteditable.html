<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>E2E contenteditable test page</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 24px; }
    h1 { font-size: 18px; margin: 0 0 16px 0; }
    .editor {
      width: 600px; min-height: 200px;
      border: 1px solid #d0d7de; border-radius: 6px; padding: 8px;
      font: inherit;
    }
    .status { margin-top: 16px; padding: 8px; background: #f0f3f6; border-radius: 6px; min-height: 24px; }
  </style>
</head>
<body>
  <h1>Local Writing Assistant — E2E contenteditable page</h1>
  <div id="editor" class="editor" contenteditable="true">She don't like it.</div>
  <div class="status" id="status">idle</div>

  <script>
    window.__getEditorValue = function () {
      return document.getElementById('editor').innerText;
    };
  </script>
</body>
</html>
