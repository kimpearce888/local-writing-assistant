name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- Extension: typecheck + unit tests + audits ----
  extension:
    name: Extension (typecheck + tests + audits)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            extension/package-lock.json

      - name: Install root dependencies (vitest, jsdom)
        run: npm install --no-audit --no-fund

      - name: Install extension dependencies
        working-directory: extension
        run: npm install --no-audit --no-fund

      - name: Type-check
        working-directory: extension
        run: npm run typecheck

      - name: Run Vitest unit tests
        run: npx vitest run --reporter=verbose

      - name: Static network audit (spec section 92)
        run: node scripts/network-audit.cjs

      - name: Static security audit (spec section 93)
        run: node scripts/security-audit.cjs

      - name: Build extension
        working-directory: extension
        run: npm run build

      - name: Verify manifest.json is valid JSON
        working-directory: extension
        run: jq . dist/manifest.json > /dev/null

      - name: Verify dist contains all expected entry points
        working-directory: extension
        run: |
          for f in manifest.json background.js content.js popup.js sidepanel.js options.js popup.html sidepanel.html options.html content.css; do
            if [ ! -f "dist/$f" ]; then
              echo "MISSING: dist/$f"
              exit 1
            fi
          done

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-dist
          path: extension/dist/
          retention-days: 14

  # ---- Native host: Go unit tests ----
  native-tests:
    name: Native host (Go unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native-host
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: go vet
        run: go vet ./...

      - name: gofmt check
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "gofmt found unformatted files:"
            echo "$out"
            exit 1
          fi

      - name: Go unit tests
        run: go test -race -v ./...

  # ---- Native host: integration tests (wire protocol) ----
  native-integration:
    name: Native host (integration tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Integration tests (build host + exercise wire protocol)
        run: go test -v ./...

  # ---- Cross-compile: prove the Windows EXE builds ----
  cross-compile:
    name: Cross-compile Windows EXE
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native-host
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Build windows/amd64
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          go build -ldflags="-s -w" -o build/LocalWritingAssistantHost.exe ./cmd/localwritingassistanthost
          file build/LocalWritingAssistantHost.exe

      - name: Verify PE32+ magic
        run: |
          head -c 2 build/LocalWritingAssistantHost.exe | od -c | head -1
          head -c 2 build/LocalWritingAssistantHost.exe | grep -q "MZ" || { echo "Not a PE executable"; exit 1; }

      - name: Upload Windows EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-host-exe
          path: native-host/build/LocalWritingAssistantHost.exe
          retention-days: 14

  # ---- E2E browser tests with Playwright + mock AI ----
  e2e:
    name: E2E browser tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            extension/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Install root deps (vitest, playwright, jsdom)
        run: npm install --no-audit --no-fund

      - name: Install extension deps
        working-directory: extension
        run: npm install --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Install xvfb (virtual display)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y xvfb

      - name: "Build extension (two-pass: SW + IIFE content.js)"
        working-directory: extension
        run: npm run build

      - name: Build native host (Linux, for tests)
        working-directory: native-host
        run: |
          mkdir -p build
          go build -o build/LocalWritingAssistantHost ./cmd/localwritingassistanthost

      - name: Run Playwright E2E tests
        env:
          LOCAL_MOCK_AI: "true"
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" npx playwright test --reporter=list

      - name: Upload Playwright trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  # ---- Aggregate: only green if every job above is green ----
  all-green:
    name: All checks passed
    runs-on: ubuntu-latest
    needs: [extension, native-tests, native-integration, cross-compile, e2e]
    steps:
      - run: echo "All required jobs passed."
