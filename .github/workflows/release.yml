name: Release

# Triggered by pushing a tag like v1.2.3. Builds the Windows EXE, builds
# the extension, assembles the final ZIP in the structure described in
# spec section 80, and uploads it as a GitHub Release asset.
#
# No tokens are checked into the repo — this workflow uses the
# automatically-provided GITHUB_TOKEN, which is scoped to the repo.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (must already exist)"
        required: true
        type: string

permissions:
  contents: write  # needed to create the release + upload assets

jobs:
  build-and-release:
    name: Build + publish Windows ZIP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            extension/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.23"
          cache: true

      - name: Resolve tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "name=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      # ---- Pre-flight checks ----
      - name: Static network audit
        run: node scripts/network-audit.cjs

      - name: Static security audit
        run: node scripts/security-audit.cjs

      # ---- Build native host for Windows ----
      - name: Build Windows native host
        working-directory: native-host
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          mkdir -p build
          go build -ldflags="-s -w" -o build/LocalWritingAssistantHost.exe ./cmd/localwritingassistanthost
          file build/LocalWritingAssistantHost.exe

      # ---- Build native host for Linux (same Go source, no GOOS override) ----
      - name: Build Linux native host
        working-directory: native-host
        env:
          CGO_ENABLED: "0"
        run: |
          go build -ldflags="-s -w" -o build/LocalWritingAssistantHost ./cmd/localwritingassistanthost
          file build/LocalWritingAssistantHost
          chmod +x build/LocalWritingAssistantHost

      # ---- Build extension ----
      - name: Install root dependencies (vitest, jsdom)
        run: npm install --no-audit --no-fund

      - name: Install extension deps
        working-directory: extension
        run: npm install --no-audit --no-fund

      - name: Type-check extension
        working-directory: extension
        run: npm run typecheck

      - name: Build extension
        working-directory: extension
        run: npm run build

      # ---- Optionally build the signed CRX3 (only if the signing key
      # secret is configured). When the secret is absent we just ship
      # the ZIP, which works for Mode B installs. ----
      - name: Build signed CRX3
        env:
          CRX_SIGNING_KEY: ${{ secrets.CRX_SIGNING_KEY }}
        run: |
          if [ -z "$CRX_SIGNING_KEY" ]; then
            echo "CRX_SIGNING_KEY secret not set — skipping CRX3 build (ZIP-only release)."
            exit 0
          fi
          mkdir -p .keys
          echo "$CRX_SIGNING_KEY" | base64 -d > .keys/extension.pem
          # The committed extension/public/manifest.json ALREADY has
          # the RSA public key embedded under the "key" field, so we
          # do NOT need to call scripts/embed-public-key.sh (which
          # additionally requires .keys/extension.pub.b64 and
          # .keys/extension.id — neither is provisioned by this
          # workflow, so the script always failed and silently
          # skipped the CRX build under set -euo pipefail).
          node scripts/build-crx.cjs
          # Place the CRX next to the ZIP so both are uploaded.
          cp dist/extension.crx dist/Local-Writing-Assistant-Windows.crx
          sha256sum dist/extension.crx > dist/extension.crx.sha256

      # ---- Assemble the ZIPs (Windows + Linux) ----
      - name: Package ZIPs
        run: node scripts/package.cjs

      - name: Verify ZIPs exist
        run: |
          ls -la dist/Local-Writing-Assistant-Windows.zip
          ls -la dist/Local-Writing-Assistant-Linux.zip
          test -f dist/Local-Writing-Assistant-Windows.zip
          test -f dist/Local-Writing-Assistant-Linux.zip
          # Print top-level contents of each ZIP for the release log.
          echo "--- Windows ZIP contents ---"
          unzip -l dist/Local-Writing-Assistant-Windows.zip | head -25
          echo "--- Linux ZIP contents ---"
          unzip -l dist/Local-Writing-Assistant-Linux.zip | head -25

      # ---- Publish ----
      - name: Create or update GitHub Release
        id: release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: "Local Writing Assistant ${{ steps.tag.outputs.name }}"
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            dist/Local-Writing-Assistant-Windows.zip
            dist/Local-Writing-Assistant-Linux.zip
            dist/Local-Writing-Assistant-Windows.crx
            dist/extension.crx.sha256
          body: |
            ## Download

            **Windows:**
            [Local-Writing-Assistant-Windows.zip](https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.name }}/Local-Writing-Assistant-Windows.zip)

            **Linux:**
            [Local-Writing-Assistant-Linux.zip](https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.name }}/Local-Writing-Assistant-Linux.zip)

            ## Quick start — Windows

            1. Download and extract `Local-Writing-Assistant-Windows.zip`.
            2. Double-click `Install.bat`.
            3. The installer auto-bootstraps LM Studio (download + silent install + launch + start server on port 1234). The one unavoidable manual step is loading your first model — open LM Studio → Search tab → download e.g. Qwen2.5 7B Instruct → Local Server tab → Start Server.
            4. Click the extension toolbar icon → **Test LM Studio Connection** (should show `● Connected`).
            5. Start writing in any `<textarea>`, supported `<input>`, or `contenteditable` editor.

            ## Quick start — Linux

            1. Download and extract `Local-Writing-Assistant-Linux.zip`.
            2. Run `./install.sh` (or `bash install.sh`). The script:
               - Detects your browser (Google Chrome / Chromium / Brave / Microsoft Edge / Vivaldi).
               - Installs the native host binary to `~/.local/share/LocalWritingAssistant/native-host/`.
               - Writes the native messaging manifest to `~/.config/<browser>/NativeMessagingHosts/`.
               - Copies the extension to `~/.local/share/LocalWritingAssistant/extension/`.
               - Bootstraps LM Studio (opens the AppImage download page if not installed).
               - Prints clear instructions for the one-time `Load unpacked` step.
            3. In `chrome://extensions` → enable **Developer mode** → **Load unpacked** → select `~/.local/share/LocalWritingAssistant/extension`.
            4. Open LM Studio, load a chat-capable model, start the local server on port 1234.
            5. Start writing.

            ## What is this

            A fully local AI writing assistant for Chrome / Chromium on Windows and Linux, powered by LM Studio. No cloud, no telemetry, no remote backend, no account, no login. The user's text never leaves the user's computer.

            The architecture is: WEB PAGE → content script → service worker → Chrome native messaging → standalone Go host binary → `http://127.0.0.1:1234` → LM Studio → local LLM.

            ## Build provenance

            This release was built automatically by GitHub Actions from tag `${{ steps.tag.outputs.name }}`.
            - Build commit: `${{ github.sha }}`
            - Builder: GitHub-hosted Ubuntu runner
            - All CI checks (typecheck, network audit, security audit, Go unit tests, integration tests, Windows cross-compile, Linux native build) passed before packaging.
            - Each ZIP's SHA-256 is printed in the build log.

      - name: Print asset SHA-256
        run: |
          sha256sum dist/Local-Writing-Assistant-Windows.zip
          sha256sum dist/Local-Writing-Assistant-Linux.zip
