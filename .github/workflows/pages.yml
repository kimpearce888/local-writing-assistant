name: Publish GitHub Pages

# Publishes the CRX3 + update.xml to GitHub Pages so that Mode A
# (enterprise force-install) can reference a stable URL:
#
#   https://kimpearce888.github.io/local-writing-assistant/update.xml
#
# The update.xml is generated at build time and points at the CRX on
# the same Pages site. Mode A enterprises configure ExtensionInstallForcelist
# to reference this URL — Chrome then silently installs/updates the
# extension on every machine in the org.
#
# This workflow runs on every push to main and on every release.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    name: Build CRX3 + update.xml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            extension/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.23"
          cache: true

      - name: Install root deps
        run: npm install --no-audit --no-fund

      - name: Install extension deps
        working-directory: extension
        run: npm install --no-audit --no-fund

      - name: Build extension
        working-directory: extension
        run: npm run build

      - name: Build CRX3
        env:
          # The signing key is stored as a CI secret. Locally, it lives
          # in .keys/extension.pem (gitignored). For the GitHub Pages
          # build, the maintainer adds it as the repository secret
          # CRX_SIGNING_KEY (base64-encoded PEM).
          CRX_SIGNING_KEY: ${{ secrets.CRX_SIGNING_KEY }}
        run: |
          if [ -z "$CRX_SIGNING_KEY" ]; then
            echo "WARNING: CRX_SIGNING_KEY secret is not set."
            echo "The CRX file will not be signed, and Mode A force-install will not work."
            echo "Skipping CRX build — only the ZIP will be published."
            mkdir -p dist-pages
            cp -r extension/dist dist-pages/extension
            exit 0
          fi
          mkdir -p .keys
          echo "$CRX_SIGNING_KEY" | base64 -d > .keys/extension.pem
          # Embed the public key in manifest.json so Chrome computes the
          # stable extension ID.
          ./scripts/embed-public-key.sh
          node scripts/build-crx.cjs
          # Stage the Pages content.
          mkdir -p dist-pages
          cp dist/extension.crx dist-pages/
          # Generate the update.xml pointing at the Pages URL.
          EXT_ID=$(cat .keys/extension.id)
          PAGES_BASE="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          cat > dist-pages/update.xml <<EOF
          <gupdate xmlns="http://www.google.com/update2/response" protocol="2.0">
            <app appid="${EXT_ID}">
              <updatecheck codebase="${PAGES_BASE}/extension.crx" version="1.0.0" />
            </app>
          </gupdate>
          EOF
          # Also publish the extension folder itself, for direct "load unpacked" downloads.
          cp -r extension/dist dist-pages/extension

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
