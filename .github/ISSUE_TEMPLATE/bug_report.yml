name: Bug report
description: Report something that's broken or behaves incorrectly.
title: "[bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report!

        Before you fill this in, please search existing issues to avoid duplicates.

  - type: input
    id: version
    attributes:
      label: Version
      description: What version of Local Writing Assistant are you running?
      placeholder: "1.0.0"
    validations:
      required: true

  - type: dropdown
    id: chrome-install-mode
    attributes:
      label: Chrome installation mode
      description: How was the extension installed?
      options:
        - Mode A — enterprise force-install
        - Mode B — Load unpacked
        - Not sure
    validations:
      required: true

  - type: input
    id: lm-studio-model
    attributes:
      label: LM Studio model
      description: Which LM Studio model were you using when the bug occurred?
      placeholder: "e.g. qwen2.5-7b-instruct"
    validations:
      required: false

  - type: input
    id: editor
    attributes:
      label: Editor where the bug occurred
      description: Which website / editor were you typing in?
      placeholder: "e.g. Gmail compose, Outlook web, plain <textarea> on example.com"
    validations:
      required: false

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the unexpected behavior. Mention the exact text you were typing if it's relevant.
      placeholder: "I typed ... and expected ... but instead ..."
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: As detailed as possible — the maintainer needs to be able to reproduce the bug to fix it.
      placeholder: |
        1. Open <page>
        2. Click into <editor>
        3. Type "..."
        4. Wait for suggestion
        5. Click Replace
        6. Observe: <bug>
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics output
      description: Output of Diagnose.bat (redact any personal info first). This is extremely helpful — without it, the maintainer is guessing.
      render: shell
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have NOT included any passwords, API keys, or other secrets in this report.
          required: true
