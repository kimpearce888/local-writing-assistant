# Dependabot configuration
#
# Keeps npm packages and Go modules up to date. Dependency updates are
# especially security-sensitive for this project because the whole point
# is that nothing phones home — a compromised transitive dependency
# could violate that promise.
#
# All Dependabot PRs should be reviewed for:
#   - new network calls (run `npm run audit:network`)
#   - new eval / shell-exec patterns (run `npm run audit:security`)
#   - changes to the dependency's license

version: 2

updates:
  # Root package.json (jsdom, vitest)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies", "triage"]
    commit-message:
      prefix: "deps(root)"
    groups:
      vitest:
        patterns: ["vitest", "@vitest/*"]
      jsdom:
        patterns: ["jsdom", "tough-cookie"]

  # Extension package.json (@types/chrome, @types/node, rimraf, typescript, vite, vitest)
  - package-ecosystem: npm
    directory: /extension
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies", "triage", "extension"]
    commit-message:
      prefix: "deps(extension)"
    groups:
      types:
        patterns: ["@types/*"]
      vite:
        patterns: ["vite", "@vitejs/*", "rollup"]
      vitest:
        patterns: ["vitest", "@vitest/*"]

  # Go modules in the native host
  - package-ecosystem: gomod
    directory: /native-host
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies", "triage", "native-host"]
    commit-message:
      prefix: "deps(native-host)"

  # Go modules in the integration tests (separate go.mod)
  - package-ecosystem: gomod
    directory: /tests
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies", "triage", "tests"]
    commit-message:
      prefix: "deps(tests)"

  # GitHub Actions themselves. Group ALL action updates into a single
  # PR so we don't get one branch per action (was producing 3-5
  # branches per week — the maintainer prefers to keep the repo
  # branchless except for main, so consolidating is the right call).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "deps(ci)"
    groups:
      all-actions:
        patterns: ["*"]
